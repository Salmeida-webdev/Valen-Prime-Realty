<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Página não encontrada | Valen Prime Realty</title>
    <meta
      name="description"
      content="A página que você tentou acessar não foi encontrada. Retorne para a experiência premium da Valen Prime Realty."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#080807" />

    <link rel="icon" href="assets/logos/favicons/favicon.ico" sizes="any" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body class="error-page">
    <main class="error-404">
      <picture class="error-404__bg" aria-hidden="true">
        <source
          srcset="assets/images/backgrounds/background-premium-dark.avif"
          type="image/avif"
        />
        <img
          src="assets/images/backgrounds/background-premium-dark.webp"
          alt=""
        />
      </picture>

      <div class="error-404__overlay" aria-hidden="true"></div>

      <section
        class="container error-404__content"
        aria-labelledby="error-title"
      >
        <a
          class="error-404__logo"
          href="index.html"
          aria-label="Voltar para a página inicial"
        >
          <img
            src="assets/logos/valen-logo-light.png"
            alt="Valen Prime Realty"
            width="190"
            height="50"
          />
        </a>

        <span class="section-kicker">Erro 404</span>

        <h1 id="error-title">Esta propriedade não está mais disponível.</h1>

        <p>
          A página que você tentou acessar foi removida, alterada ou está
          temporariamente indisponível. Retorne para a curadoria principal e
          continue explorando propriedades extraordinárias.
        </p>

        <div class="error-404__actions">
          <a class="btn btn--primary" href="index.html">
            <span>Voltar para o início</span>
            <img
              src="assets/icons/icon-arrow-right.svg"
              alt=""
              width="18"
              height="18"
            />
          </a>

          <a class="btn btn--secondary" href="index.html#propriedades">
            <span>Explorar propriedades</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
